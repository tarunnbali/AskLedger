[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "S"]
ignore = [
    "S101",  # assert is how pytest works
    "S608",  # SQL built from constants / LLM output is validated elsewhere
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]
"scripts/demo_data.py" = ["S311"]
"app/services/conversation_service.py" = ["E501"]  # long lines are prompt prose  # demo data, not security-sensitive randomness
