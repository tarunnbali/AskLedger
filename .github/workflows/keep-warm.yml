# Render's free plan puts the backend to sleep after 15 minutes without
# traffic, and waking it takes 30-60s. Pinging the health endpoint every
# 10 minutes keeps it awake so visitors don't hit a cold start.
# (GitHub may delay scheduled runs at busy times, so this is best-effort.)
name: Keep backend warm

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping health endpoint
        run: curl --fail --silent --show-error --max-time 120 https://askledger-backend.onrender.com/api/v1/health
